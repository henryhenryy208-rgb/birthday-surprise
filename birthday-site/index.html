<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 21st, Handsome ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500;1,700&family=Kalam:wght@400;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a0f24;--bg2:#4a1639;--blush:#ffd9e2;--rose:#ff4d6d;--gold:#f4c872;--paper:#fff7f2;--ink:#3b1d33;
--serif:'Cormorant Garamond',Georgia,serif;--hand:'Caveat','Kalam','Segoe Print',cursive;}
@media (prefers-color-scheme:dark){:root{--bg:#240c1f}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh}
.screen{scrollbar-width:none;-ms-overflow-style:none}
.screen::-webkit-scrollbar{display:none;width:0;height:0}
html{scrollbar-width:none}
body{background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg) 65%);color:var(--blush);font-family:var(--serif);overflow:hidden;
padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
#hearts,#confetti{position:fixed;inset:0;pointer-events:none;width:100%;height:100%}
#hearts span{position:absolute;bottom:-40px;opacity:0;animation:rise linear infinite;color:var(--rose)}
@keyframes rise{10%{opacity:.35}100%{transform:translateY(-110vh) rotate(25deg);opacity:0}}
#stage{position:relative;height:100%;max-width:520px;margin:0 auto}
.screen{position:absolute;inset:0;overflow-y:auto;padding:28px 24px 40px;display:none;flex-direction:column;align-items:center;text-align:center;-webkit-overflow-scrolling:touch}
.screen.on{display:flex;animation:in .6s cubic-bezier(.2,.8,.2,1)}
.screen.back.on{animation-name:inb}
@keyframes in{from{opacity:0;transform:translateX(40px) scale(.97)}}
@keyframes inb{from{opacity:0;transform:translateX(-40px) scale(.97)}}
.screen>.grow{flex:1 0 8px}
h1{font-style:italic;font-weight:700;font-size:clamp(34px,10vw,50px);line-height:1.05;color:#fff;margin:18px 0 14px}
p.sub{font-size:clamp(18px,4.8vw,21px);line-height:1.5;color:var(--blush);max-width:34ch}
p.sub+p.sub{margin-top:12px}
.btn{font-family:var(--serif);font-weight:700;font-size:20px;border:0;border-radius:99px;padding:15px 34px;background:linear-gradient(135deg,#ff6b85,var(--rose));color:#fff;box-shadow:0 8px 26px rgba(255,77,109,.45);cursor:pointer;margin-top:24px;transition:transform .15s}
.btn:active{transform:scale(.95)}
.btn.ghost{background:none;box-shadow:none;border:1.5px solid rgba(255,217,226,.4);color:var(--blush);padding:12px 22px;font-size:17px;margin:0}
.link{background:none;border:0;color:var(--blush);opacity:.7;font:italic 17px var(--serif);margin-top:16px;text-decoration:underline;cursor:pointer}
/* polaroid */
.pol{position:relative;background:#fffaf5;padding:12px 12px 46px;border-radius:4px;width:min(66vw,260px,32vh);transform:rotate(-4deg);box-shadow:0 18px 40px rgba(0,0,0,.5);animation:float 5s ease-in-out infinite;margin-top:6px}
.pol img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 30%;display:block;border-radius:2px}
.pol b{position:absolute;left:0;right:0;bottom:9px;font:700 25px var(--hand);color:var(--ink)}
.pol i{position:absolute;top:-14px;left:50%;width:84px;height:26px;margin-left:-42px;background:rgba(244,200,114,.75);transform:rotate(3deg)}
.pol .h{position:absolute;right:-14px;top:-14px;font-size:34px;animation:beat 1.2s infinite}
@keyframes float{50%{transform:rotate(-2deg) translateY(-8px)}}
@keyframes beat{30%{transform:scale(1.25)}60%{transform:scale(1)}}
/* letter */
.paper{background:var(--paper) repeating-linear-gradient(transparent 0 33px,rgba(255,77,109,.16) 33px 34px);color:var(--ink);text-align:left;border-radius:6px;padding:26px 22px 30px 26px;box-shadow:0 18px 44px rgba(0,0,0,.45);font-family:var(--hand);font-weight:500;font-size:clamp(21px,5.6vw,25px);line-height:34px;width:100%;position:relative;border-left:3px solid rgba(255,77,109,.35)}
.paper p{margin-bottom:34px}
.paper .big{font-size:1.5em;font-weight:700;color:var(--rose);line-height:34px}
.paper .sig{text-align:right;font-size:1.2em;margin-bottom:0}
/* rounds */
.top{width:100%;display:flex;justify-content:space-between;align-items:center;min-height:44px}
.top .back{background:none;border:0;color:var(--blush);font:600 18px var(--serif);cursor:pointer;padding:8px 4px;opacity:.85}
.count{font:italic 600 20px var(--serif);color:var(--gold)}
.dots{display:none}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,217,226,.22);transition:.4s}
.dots i.d{background:var(--rose)}.dots i.c{background:var(--gold);transform:scale(1.5)}
.art{height:clamp(80px,17vh,150px);width:100%;display:flex;justify-content:center;align-items:center;position:relative;margin:14px 0 6px;font-size:68px}
.art span{position:absolute;animation:bob 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(6deg)}}
.card{background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:1px solid rgba(244,200,114,.35);border-radius:22px;padding:26px 22px;width:100%;backdrop-filter:blur(6px)}
.card q{display:block;quotes:none;font-style:italic;font-weight:600;font-size:clamp(23px,6.4vw,29px);line-height:1.32;color:#fff}
.nav{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:24px}
.nav .btn{margin:0}
/* special */
.sp .card{border-color:var(--rose);box-shadow:0 0 50px rgba(255,77,109,.35);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 80px rgba(255,77,109,.6)}}
.pair{display:flex;align-items:center;gap:6px}
.pair .p1,.pair .p2{font-size:62px;animation:lean 3s ease-in-out infinite}
.pair .p1{--r:8deg}.pair .p2{--r:-8deg;animation-delay:.3s}
@keyframes lean{50%{transform:translateX(var(--x,6px)) rotate(var(--r))}}
.pair .p1{--x:10px}.pair .p2{--x:-10px}
.pair .mid{font-size:44px;animation:beat 1.1s infinite;position:static}
.tag{font:700 24px var(--hand);color:var(--gold);margin-top:2px}
.fin h1{font-size:clamp(34px,10vw,48px)}
.fin .pol{margin-top:20px}
@media (max-height:760px){.screen{padding-top:16px;padding-bottom:24px}h1{font-size:clamp(28px,5.2vh + 2vw,44px);margin:12px 0 8px}p.sub{font-size:clamp(16px,2.6vh,20px);line-height:1.4}.card{padding:18px 18px}.card q{font-size:clamp(20px,3.6vh,27px)}.btn{margin-top:14px;padding:12px 28px;font-size:18px}.art{font-size:54px;margin:6px 0 2px}.pol{padding:9px 9px 38px}}
@media (min-width:700px) and (min-height:820px){#stage{max-width:600px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

go(0);
// floating hearts
var hs=document.getElementById('hearts');
for(var i=0;i<14;i++){var s=document.createElement('span');s.textContent=['❤','♥','✦'][i%3];s.style.cssText='left:'+(Math.random()*100)+'%;font-size:'+(12+Math.random()*20)+'px;animation-duration:'+(9+Math.random()*9)+'s;animation-delay:'+(-Math.random()*14)+'s';hs.appendChild(s)}
// confetti
var cv=document.getElementById('confetti'),cx=cv.getContext('2d'),P=[],run=false;
function fit(){cv.width=innerWidth;cv.height=innerHeight}fit();addEventListener('resize',fit);
function boom(){
 var em=['❤','♥','✦','●'],cl=['#ff4d6d','#f4c872','#ffd9e2','#fff','#ff9bb0'];
 for(var i=0;i<110;i++)P.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-3,s:8+Math.random()*14,c:cl[i%5],t:em[i%4],r:Math.random()*6,l:1});
 if(!run){run=true;tick()}
}
function tick(){
 cx.clearRect(0,0,cv.width,cv.height);
 P=P.filter(function(p){p.vy+=.28;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=.1;p.l-=.006;
  cx.save();cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;cx.font=p.s+'px serif';cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillText(p.t,0,0);cx.restore();
  return p.l>0&&p.y<innerHeight+40});
 if(P.length)requestAnimationFrame(tick);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}
}
</script>
</body>
</html>
